<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>htmx Demo</title>
  </head>
  <body>
    <section class="hero is-link">
      <div class="hero-body">
        <p class="title">Hello, htmx!</p>
        <p class="subtitle">A tiny Vite demo styled with Bulma.</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div class="box">
          <h1 class="title is-4">Hello world</h1>
          <p class="content">
            Click the button below to let htmx fetch a small HTML fragment.
          </p>
          <button
            class="button is-primary"
            hx-get="/hello-world.html"
            hx-swap="innerHTML"
            hx-target="#hello-message"
            type="button"
          >
            Load message
          </button>
          <div
            id="hello-message"
            class="notification is-light mt-5"
            aria-live="polite"
          >
            Your htmx response will appear here.
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
