<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celebrate a Birthday</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Celebrate a Birthday</p>
        <p class="subtitle">Celebrate a birthday at Ottawa Family Cinema</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div
          id="birthday-intro"
          class="PageIntro"
          hx-get="/api/birthdays.html?section=intro"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <progress class="progress is-small is-link" max="100">
            Loading&hellip;
          </progress>
        </div>

        <div class="box">
          <form id="birthday-form">
            <div
              id="birthday-fields"
              hx-get="/api/birthdays.html"
              hx-trigger="load"
              hx-include="#birthday-form"
              hx-swap="innerHTML"
              hx-target="this"
              hx-vals='js:{"test": new URLSearchParams(location.search).get("test") || ""}'
            >
              <progress class="progress is-small is-link" max="100">
                Loading&hellip;
              </progress>
            </div>
          </form>

          <div id="party-plan" class="mt-5"></div>
        </div>

        <div
          id="birthday-packages"
          hx-get="/api/birthdays.html?section=packages"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <progress class="progress is-small is-link" max="100">
            Loading&hellip;
          </progress>
        </div>
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
