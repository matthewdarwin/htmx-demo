<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">404 Not Found</p>
        <p class="subtitle">Sorry, we couldn't find that page</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <article class="message is-info">
          <div class="message-header">
            <p><strong>Page Not Found</strong></p>
          </div>
          <div class="message-body">
            The document "<i id="missing-path"></i>" cannot be found on the
            server.
          </div>
        </article>
        <div class="buttons">
          <a class="button is-primary" href="/">Home</a>
        </div>
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
