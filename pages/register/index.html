<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Registration</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Account Registration</p>
        <p class="subtitle">
          Create a new account to manage your membership online
        </p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <p class="mb-4">Fill out the form below to create a new account.</p>

        <div class="box">
          <form
            novalidate
            id="register-form"
            hx-post="/api/account_new.html"
            hx-swap="innerHTML"
            hx-target="#register-message"
            hx-disabled-elt="find button[type='submit']"
          >
            <input type="hidden" id="register-uri" name="uri" />

            <div class="field">
              <label class="label" for="login">E-mail address</label>
              <div class="control">
                <input
                  class="input"
                  id="login"
                  name="login"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label class="label" for="name">Full name</label>
              <div class="control">
                <input
                  class="input"
                  id="name"
                  name="name"
                  type="text"
                  placeholder="Your full name"
                  autocomplete="name"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label class="label">Receive announcements</label>
              <div class="control">
                <label class="radio">
                  <input
                    type="radio"
                    name="send_announcement"
                    value="1"
                    checked
                  />
                  Yes
                </label>
                <label class="radio">
                  <input type="radio" name="send_announcement" value="0" />
                  No
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label">
                Receive promotions (e.g. free ticket offers)
              </label>
              <div class="control">
                <label class="radio">
                  <input type="radio" name="send_promo" value="1" checked />
                  Yes
                </label>
                <label class="radio">
                  <input type="radio" name="send_promo" value="0" />
                  No
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label">Receive weekly schedule</label>
              <div class="control">
                <label class="radio">
                  <input type="radio" name="send_schedule" value="1" checked />
                  Yes
                </label>
                <label class="radio">
                  <input type="radio" name="send_schedule" value="0" />
                  No
                </label>
              </div>
            </div>

            <div class="field">
              <label class="label" for="check">
                Human check: what is the current year?
              </label>
              <div class="control">
                <input
                  class="input"
                  id="check"
                  name="check"
                  type="text"
                  inputmode="numeric"
                  maxlength="4"
                  placeholder="e.g. YYYY"
                  autocomplete="off"
                  required
                />
              </div>
            </div>

            <div class="field">
              <div class="control">
                <button class="button is-primary" type="submit">
                  Create account
                </button>
              </div>
            </div>
          </form>

          <div
            id="register-message"
            class="mt-5 is-hidden"
            aria-live="polite"
          ></div>
        </div>

        <div id="register-crossnav" class="mt-5 has-text-centered">
          <p class="mb-2">Alternatively:</p>
          <div class="buttons is-centered">
            <a class="button is-light" href="/login/"
              >Already Have an Account? Log In</a
            >
            <a class="button is-light" href="/recover/">Trouble Logging In?</a>
          </div>
        </div>
      </div>
    </main>

    <!--#include footer.html -->

    <script>
      document.getElementById('register-uri').value =
        new URLSearchParams(location.search).get('uri') || ''
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
