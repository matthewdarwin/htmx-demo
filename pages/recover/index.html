<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One-Time Login Link</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">One-Time Login Link</p>
        <p class="subtitle">Don&rsquo;t Use or Forgot Your Password?</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div class="box">
          <form
            novalidate
            id="recover-form"
            hx-post="/api/account_recover.html"
            hx-swap="innerHTML"
            hx-target="#recover-message"
            hx-disabled-elt="find button[type='submit']"
          >
            <input type="hidden" id="recover-uri" name="uri" />

            <div class="field">
              <label class="label" for="email">E-mail address</label>
              <div class="control">
                <input
                  class="input"
                  id="email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label class="label" for="check">
                Human check: what is the current year?
              </label>
              <div class="control">
                <input
                  class="input"
                  id="check"
                  name="check"
                  type="text"
                  inputmode="numeric"
                  maxlength="4"
                  placeholder="e.g. YYYY"
                  autocomplete="off"
                  required
                />
              </div>
            </div>

            <div class="field">
              <div class="control">
                <button class="button is-primary" type="submit">
                  Send Login Link
                </button>
              </div>
            </div>
          </form>

          <div
            id="recover-message"
            class="mt-5 is-hidden"
            aria-live="polite"
          ></div>
        </div>

        <div id="recover-crossnav" class="mt-5 has-text-centered">
          <p class="mb-2">Alternatively:</p>
          <div class="buttons is-centered">
            <a class="button is-light" href="/login/">Log In with a Password</a>
            <a class="button is-light" href="/register/"
              >Register for an Account</a
            >
          </div>
        </div>
      </div>
    </main>

    <!--#include footer.html -->

    <script>
      document.getElementById('recover-uri').value =
        new URLSearchParams(location.search).get('uri') || ''
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
