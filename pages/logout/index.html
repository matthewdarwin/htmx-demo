<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logout</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Logout</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div class="box">
          <div
            id="logout-form"
            hx-post="/api/account_logout.html"
            hx-trigger="load"
            hx-target="#logout-message"
            hx-swap="innerHTML"
          ></div>

          <div id="logout-message" class="mt-5">
            <progress class="progress is-primary" max="100"></progress>
          </div>
        </div>
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
