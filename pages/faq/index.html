<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Frequently Asked Questions</p>
        <p class="subtitle">
          Answers to common questions about Ottawa Family Cinema
        </p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div class="PageIntro">
          <p class="content">
            Here are a few frequently asked questions (with answers) about the
            Ottawa Family Cinema.
          </p>
        </div>

        <div
          id="faq-list"
          class="faq-list"
          hx-get="/api/faq.html"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <progress class="progress is-small is-link" max="100">
            Loading&hellip;
          </progress>
        </div>
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
