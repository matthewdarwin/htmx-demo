<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay for Order</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Pay for Order</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div id="account-page-content" class="is-hidden">
          <p class="mb-4">
            <a href="/account/cart/"
              ><i class="fas fa-arrow-left"></i>
              Back to Cart</a
            >
          </p>

          <div class="box">
            <form
              id="order-pay-form"
              hx-post="/api/account_order_pay.html"
              hx-swap="innerHTML"
              hx-target="#order-pay-message"
              hx-disabled-elt="find button[type='submit']"
            >
              <input type="hidden" id="order-pay-member-id" name="member_id" />
              <input type="hidden" id="order-pay-order-id" name="order_id" />
              <input type="hidden" name="source_id" />

              <div
                id="order-pay-fields"
                class="hx-content"
                hx-get="/api/account_order_pay.html"
                hx-trigger="load"
                hx-include="#order-pay-form"
                hx-swap="innerHTML"
                hx-target="this"
                hx-disabled-elt="unset"
              >
                <progress class="progress is-small is-link" max="100">
                  Loading&hellip;
                </progress>
              </div>

              <div class="field">
                <label class="label">Card Details</label>
                <div class="control">
                  <div id="square-card"></div>
                </div>
              </div>

              <div class="field">
                <div class="control">
                  <button class="button is-primary" type="submit" disabled>
                    Pay Now
                  </button>
                </div>
              </div>
            </form>
            <script>
              document.getElementById('order-pay-member-id').value =
                new URLSearchParams(location.search).get('member_id') || ''
              document.getElementById('order-pay-order-id').value =
                new URLSearchParams(location.search).get('order_id') || ''
            </script>

            <div
              id="order-pay-message"
              class="mt-5 is-hidden"
              aria-live="polite"
            ></div>

            <div id="order-pay-next-steps" class="mt-5 is-hidden">
              <div class="buttons">
                <a class="button is-primary" href="/account/cart/"
                  >Back to Cart</a
                >
                <a class="button is-light" href="/">Home</a>
              </div>
            </div>
          </div>
        </div>

        <!--#include account-login-prompt.html -->
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
