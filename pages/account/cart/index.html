<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">My Cart</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div id="account-page-content" class="is-hidden">
          <p class="mb-4">
            <a href="/account/"
              ><i class="fas fa-arrow-left"></i>
              Back to Account</a
            >
          </p>

          <div
            id="cart-content"
            class="hx-content"
            hx-get="/api/account_order_review.html"
            hx-trigger="load"
            hx-swap="innerHTML"
            hx-target="this"
            hx-disabled-elt="unset"
          >
            <progress class="progress is-small is-link" max="100">
              Loading&hellip;
            </progress>
          </div>

          <div class="box">
            <div class="buttons">
              <a class="button is-primary" href="/account/membership/new/"
                >Create Membership</a
              >
            </div>
          </div>
        </div>

        <!--#include account-login-prompt.html -->
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
