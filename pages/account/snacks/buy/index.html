<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Snacks</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Buy Snacks</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div id="account-page-content" class="is-hidden">
          <p class="mb-4">
            <a href="/account/cart/"
              ><i class="fas fa-arrow-left"></i>
              Back to Cart</a
            >
          </p>

          <div class="box">
            <form
              novalidate
              id="snack-buy-form"
              hx-post="/api/account_snack_buy.html"
              hx-swap="innerHTML"
              hx-target="#snack-buy-message"
              hx-disabled-elt="find button[type='submit']"
            >
              <input type="hidden" id="snack-buy-member-id" name="member_id" />

              <div
                id="snack-buy-fields"
                class="hx-content"
                hx-get="/api/account_snack_buy.html"
                hx-trigger="load"
                hx-include="#snack-buy-form"
                hx-swap="innerHTML"
                hx-target="this"
                hx-disabled-elt="unset"
              >
                <progress class="progress is-small is-link" max="100">
                  Loading&hellip;
                </progress>
              </div>

              <div class="field">
                <div class="control">
                  <button class="button is-primary" type="submit" disabled>
                    Update Order
                  </button>
                </div>
              </div>
            </form>
            <script>
              document.getElementById('snack-buy-member-id').value =
                new URLSearchParams(location.search).get('member_id') || ''
            </script>

            <div
              id="snack-buy-message"
              class="mt-5 is-hidden"
              aria-live="polite"
            ></div>

            <div id="snack-buy-next-steps" class="mt-5 is-hidden">
              <div class="buttons">
                <a class="button is-primary" href="/account/cart/">View Cart</a>
                <a class="button is-light" href="/account/membership/"
                  >Back to Membership</a
                >
              </div>
            </div>
          </div>
        </div>

        <!--#include account-login-prompt.html -->
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
