<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <main class="section">

        <div id="account-page-content" class="is-hidden">
          <div class="box">
            <div class="buttons are-medium">
              <a class="button is-primary" href="/account/membership/">
                <span class="icon"><i class="fas fa-id-card"></i></span>

              </a>
              <a class="button is-primary" href="/account/name/">
                <span class="icon"><i class="fas fa-pen"></i></span>

              <a class="button is-primary" href="/account/communication/">
                <span class="icon"><i class="fas fa-envelope"></i></span>
                <span>Communication Preferences</span>
              </a>
              <a class="button is-primary" href="/account/password/">
                <span class="icon"><i class="fas fa-key"></i></span>
                <span>Change Password</span>
              </a>
            </div>
          </div>

        <!--#include account-login-prompt.html -->
