<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register as Volunteer</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Register as Volunteer</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div id="account-page-content" class="is-hidden">
          <p class="mb-4">
            <a href="/account/volunteer/"
              ><i class="fas fa-arrow-left"></i>
              Back to Volunteering</a
            >
          </p>

          <div class="box">
            <form
              novalidate
              id="volunteer-new-form"
              hx-post="/api/account_volunteer_new.html"
              hx-swap="innerHTML"
              hx-target="#volunteer-new-message"
              hx-disabled-elt="find button[type='submit']"
            >
              <div
                id="volunteer-new-fields"
                class="hx-content"
                hx-get="/api/account_volunteer_new.html"
                hx-trigger="load"
                hx-swap="innerHTML"
                hx-target="this"
                hx-disabled-elt="unset"
              >
                <progress class="progress is-small is-link" max="100">
                  Loading&hellip;
                </progress>
              </div>

              <div class="field">
                <div class="control">
                  <button class="button is-primary" type="submit" disabled>
                    Register
                  </button>
                </div>
              </div>
            </form>

            <div
              id="volunteer-new-message"
              class="mt-5 is-hidden"
              aria-live="polite"
            ></div>

            <div id="volunteer-new-next-steps" class="mt-5 is-hidden">
              <div class="buttons">
                <a class="button is-primary" href="/account/volunteer/">
                  <span class="icon"
                    ><i class="fas fa-hand-holding-heart"></i></span
                  >
                  <span>Back to Volunteering</span>
                </a>
                <a class="button is-light" href="/">
                  <span class="icon"><i class="fas fa-house"></i></span>
                  <span>Home</span>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!--#include account-login-prompt.html -->
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
