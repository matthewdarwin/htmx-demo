<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule</title>
  </head>
  <body>
    <!--#include header.html -->

    <section class="hero is-primary">
      <div class="hero-body">
        <p class="title">Schedule</p>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div id="account-page-content" class="is-hidden">
          <p class="mb-4">
            <a href="/account/volunteer/"
              ><i class="fas fa-arrow-left"></i>
              Back to Volunteering</a
            >
          </p>

          <div
            id="volunteer-schedule-content"
            class="hx-content"
            hx-get="/api/account_volunteer_schedule.html"
            hx-trigger="load"
            hx-vals="js:{volunteer_id: new URLSearchParams(location.search).get('volunteer_id') || ''}"
            hx-swap="innerHTML"
            hx-target="this"
          >
            <progress class="progress is-small is-link" max="100">
              Loading&hellip;
            </progress>
          </div>
        </div>

        <!--#include account-login-prompt.html -->
      </div>
    </main>

    <!--#include footer.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
