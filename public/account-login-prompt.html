<div id="account-login-prompt" class="is-hidden">
  <article class="message is-warning">
    <div class="message-header">
      <p><strong>Login Required</strong></p>
    </div>
    <div class="message-body">You need to be logged in to do this.</div>
  </article>
  <div class="buttons">
    <a class="button is-primary" href="/login/">
      <span class="icon"><i class="fas fa-right-to-bracket"></i></span>
      <span>Login</span>
    </a>
    <a class="button is-primary" href="/recover/">
      <span class="icon"><i class="fas fa-paper-plane"></i></span>
      <span>Get a One-Time Login Link</span>
    </a>
    <a class="button is-light" href="/register/">
      <span class="icon"><i class="fas fa-user-plus"></i></span>
      <span>Register for an Account</span>
    </a>
  </div>
</div>
